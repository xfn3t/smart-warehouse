databaseChangeLog:
  - changeSet:
      id: add-excluded-cells-to-warehouses
      author: dev
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: warehouses
            columnName: excluded_cells
      changes:
        - addColumn:
            tableName: warehouses
            columns:
              - column:
                  name: excluded_cells
                  type: JSONB