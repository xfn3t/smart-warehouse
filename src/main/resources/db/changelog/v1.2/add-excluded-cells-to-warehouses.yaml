databaseChangeLog:
  - changeSet:
      id: add-excluded-cells-to-warehouses
      author: dev
      preConditions:
        - not:
            columnExists:
              tableName: warehouses
              columnName: excluded_cells
      changes:
        - addColumn:
            tableName: warehouses
            columns:
              - column:
                  name: excluded_cells
                  type: JSONB
                  remarks: Optional (zone,row) cells excluded from the location matrix
