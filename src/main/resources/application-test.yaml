spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:54329/smart_warehouse_test
    username: wh
    password: whpwd
  redis:
    host: localhost
    port: 6379
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    show-sql: false
    properties:
      hibernate.format_sql: true
      hibernate.highlight_sql: true
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  test:
    database:
      replace: none

security:
  jwt:
    secret: test-secret-key-32chars-minimum!!

logging:
  level:
    root: warn
    ru.rtc.warehouse: info
    org.springframework.web: warn
    org.springframework.web.servlet.mvc.method.annotation: warn
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
